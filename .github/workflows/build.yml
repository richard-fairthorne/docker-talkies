name: build

on:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU variant — pinned upstream image + local server.py overlay.
          # Pushed as :latest and :<sha>.
          - dockerfile: ./Dockerfile.overlay
            tag_suffix: ""
            cache_scope: cpu
          # CUDA variant — same overlay pattern on top of upstream CUDA image.
          # Pushed as :latest-cuda and :<sha>-cuda. Larger image (~12 GB)
          # because it inherits upstream's full CUDA stack.
          - dockerfile: ./Dockerfile.overlay-cuda
            tag_suffix: "-cuda"
            cache_scope: cuda
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/richard-fairthorne/talkies:latest${{ matrix.tag_suffix }}
            ghcr.io/richard-fairthorne/talkies:${{ github.sha }}${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=min,scope=${{ matrix.cache_scope }}
